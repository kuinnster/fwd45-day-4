name: Deploy Static Site to cPanel

on:
  push:
    branches:
      - main           # Deploys code to GreenGeeks when it lands on main
  pull_request:
    branches:
      - main           # Runs validation tests automatically on Pull Requests

jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Industry-standard HTML syntax validator
      - name: Validate HTML Syntax
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: ./     # Tells it to scan your whole local folder layout

  deploy:
    needs: validate-code                    # BLOCKS deployment if validation crashes!
    if: github.event_name == 'push'         # ONLY deploy on final merge to main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./day-04/

